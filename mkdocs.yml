site_name: SeedNet
site_description: Procedurally generated frozen neural weights with fused Triton GEMM and trainable low-rank corrections.
site_url: https://fyremael.github.io/SEEDNET/
repo_url: https://github.com/fyremael/SEEDNET
repo_name: fyremael/SEEDNET
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Grand Challenge Labs

nav:
  - Overview: index.md
  - Motivation: motivation.md
  - Design:
      - Architecture: design/architecture.md
      - Model format: design/model-format.md
      - Limits and failure modes: design/limitations.md
  - Usage:
      - Installation: usage/installation.md
      - Quickstart: usage/quickstart.md
      - Training: usage/training.md
      - Benchmarking: usage/benchmarking.md
  - API reference:
      - Public API: api/index.md
      - SeedLinear: api/seedlinear.md
      - Functional interface: api/functional.md
      - Model identifiers: api/identifiers.md
  - Development: development.md
  - Changelog: changelog.md

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - navigation.footer
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_root_full_path: false
            show_source: true
            show_signature_annotations: true
            separate_signature: true
            signature_crossrefs: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
